// 示例 .proto 文件：定义 Greeter 服务。
// 生产环境中使用以下命令生成 Go 代码：
//   protoc --go_out=. --go_opt=paths=source_relative \
//          --go-grpc_out=. --go-grpc_opt=paths=source_relative \
//          api/helloworld.proto
syntax = "proto3";

option go_package = "go-tutorial/phase4/api;api";

package helloworld;

// Greeter 服务定义
service Greeter {
  // SayHello 方法
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// 请求消息
message HelloRequest {
  string name = 1;
}

// 响应消息
message HelloReply {
  string message = 1;
}
